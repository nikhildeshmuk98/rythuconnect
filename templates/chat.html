<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agriculture Chat | Rythu Connect</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:'DM Sans',sans-serif;
  background:#e9fbee;
}

/* ================= HEADER ================= */
.header{
  background:linear-gradient(135deg,#0f8f2f,#1dc94a);
  color:white;
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:10;
}

.header img{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid white;
}

.header h3{
  margin:0;
  font-size:18px;
}

/* ================= CHAT BOX ================= */
.chat-container{
  height:calc(100vh - 120px);
  overflow-y:auto;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:url("https://www.transparenttextures.com/patterns/green-dust.png");
}

/* ================= MESSAGE ================= */
.msg{
  max-width:70%;
  padding:10px 14px;
  border-radius:18px;
  font-size:14px;
  line-height:1.4;
  word-wrap:break-word;
}

.me{
  align-self:flex-end;
  background:#1dc94a;
  color:white;
  border-bottom-right-radius:4px;
}

.other{
  align-self:flex-start;
  background:white;
  border:1px solid #d4f5dd;
  color:#1e2e23;
  border-bottom-left-radius:4px;
}

/* ================= INPUT ================= */
.input-box{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  gap:10px;
  padding:12px;
  background:white;
  border-top:1px solid #cdeccd;
}

.input-box input{
  flex:1;
  padding:12px;
  border-radius:25px;
  border:1px solid #b8f5c8;
  outline:none;
}

.input-box button{
  background:linear-gradient(135deg,#0f8f2f,#1dc94a);
  border:none;
  color:white;
  padding:12px 18px;
  border-radius:25px;
  cursor:pointer;
  font-weight:600;
}

.input-box button:hover{
  transform:scale(1.05);
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->
<div class="header">
  {% if other_user.profile_image %}
    <img src="{{ url_for('static', filename='uploads/profile_images/' ~ other_user.profile_image) }}">
  {% else %}
    <img src="https://ui-avatars.com/api/?name={{ other_user.username }}">
  {% endif %}

  <h3>{{ other_user.username }}</h3>
</div>

<!-- ================= CHAT BOX ================= -->
<div class="chat-container" id="chatBox"></div>

<!-- ================= INPUT ================= -->
<div class="input-box">
  <input type="text" id="msgInput" placeholder="Type your message...">
  <button onclick="sendMessage()">Send</button>
</div>

<script>

var socket = io();

// 🔥 SAFE USER IDS (NO current_user)
var currentUser = "{{ current_user_id }}";
var otherUser = "{{ other_user.id }}";

// room id
var room = currentUser + "_" + otherUser;

// join room
socket.emit("join_room", {room: room});

// receive message
socket.on("message", function(data){

  let div = document.createElement("div");

  if(data.sender_id == currentUser){
    div.className = "msg me";
  } else {
    div.className = "msg other";
  }

  div.innerText = data.message;

  document.getElementById("chatBox").appendChild(div);

  // auto scroll
  let chatBox = document.getElementById("chatBox");
  chatBox.scrollTop = chatBox.scrollHeight;
});

// send message
function sendMessage(){

  let input = document.getElementById("msgInput");
  let msg = input.value;

  if(msg.trim() === "") return;

  socket.emit("send_message", {
    room: room,
    message: msg,
    sender_id: currentUser
  });

  input.value = "";
}

</script>

</body>
</html>
